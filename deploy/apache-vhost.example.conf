<VirtualHost *:80>
    ServerName meisai.gucchii.com
    ErrorLog ${APACHE_LOG_DIR}/meisai.gucchii.com-error.log
    CustomLog ${APACHE_LOG_DIR}/meisai.gucchii.com-access.log combined

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:3106/
    ProxyPassReverse / http://127.0.0.1:3106/
</VirtualHost>

# :443 は certbot --apache 実行時に自動追記される（手動で書かない）。
# certbotは:80の RequestHeader も含めてそのままコピーするため、:443側でも
# X-Forwarded-Proto が "http" のまま残ることがある。アプリ側（src/lib/request-origin.ts）
# は本番では X-Forwarded-Proto を信用せず常に https を使うため実害はないが、
# 他の用途でこのヘッダーを参照する場合は :443 側を "https" に手動修正すること。
